openapi: 3.0.3
info:
  title: LumiBible User API
  version: 0.1.0

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "201":
          description: Registration accepted; verification email sent
        "400":
          description: Invalid input or email already in use

  /api/auth/verify-email:
    post:
      summary: Verify user email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email verified and account activated
        "400":
          description: Invalid or expired token

  /api/auth/login:
    post:
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials or inactive account

  /api/auth/request-password-reset:
    post:
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Password reset email sent (regardless of account existence)

  /api/auth/reset-password:
    post:
      summary: Reset password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: Password reset successful
        "400":
          description: Invalid or expired token

  /api/accounts/users:
    get:
      summary: List users
      description: >-
        Returns a paginated list of users, optionally filtered by email, role, status, or
        search term.
      parameters:
        - in: query
          name: email
          schema:
            type: string
          description: Filter users by exact or partial email match.
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, contributor, user]
          description: Filter users by role.
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, active, inactive, anonymized]
          description: Filter users by account status.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination.
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Page size for pagination.
      responses:
        "200":
          description: Paginated list of users
        "403":
          description: Forbidden
    post:
      summary: Create a new user
      responses:
        "201":
          description: User created
        "400":
          description: Validation error
        "403":
          description: Forbidden

  /api/accounts/users/{userId}:
    get:
      summary: Get user details
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
        "403":
          description: Forbidden
        "404":
          description: User not found
    patch:
      summary: Update user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User updated
        "400":
          description: Validation error
        "403":
          description: Forbidden
    delete:
      summary: Deactivate (anonymize) user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Account deactivated (anonymized)
        "403":
          description: Forbidden

  /api/accounts/api-keys:
    get:
      summary: List API keys
      description: >-
        Returns API keys visible to the caller. Admins may list keys for any user; non-admin
        callers see only their own keys. Results can be filtered by owner, status, and search
        term.
      parameters:
        - in: query
          name: userId
          schema:
            type: string
          description: Filter keys by owning user (admin-only parameter).
        - in: query
          name: status
          schema:
            type: string
            enum: [active, revoked]
          description: Filter keys by status.
      responses:
        "200":
          description: List of API keys
    post:
      summary: Create a new API key
      description: >-
        Creates a new API key. Non-admin callers create keys for themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: Optional human-readable label/name for the key.
      responses:
        "201":
          description: API key created
        "400":
          description: Limit reached or validation error

  /api/accounts/api-keys/{keyId}:
    get:
      summary: Get API key details
      description: >-
        Returns metadata about a single API key. Non-admin callers can view only their own keys;
        admins may view keys for any user.
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: API key details
        "404":
          description: Key not found or not visible to caller
    patch:
      summary: Update API key metadata
      description: >-
        Allows updating mutable metadata of an API key (for example, label/name). Non-admin
        callers can update only their own keys; admins may update keys for any user.
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: New label/name for the API key.
      responses:
        "200":
          description: API key updated
        "400":
          description: Validation error
        "404":
          description: Key not found or not visible to caller
    delete:
      summary: Delete an API key
      description: >-
        Deletes an API key by ID. Non-admin callers can delete only their own keys; admins may
        delete keys for any user.
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: API key deleted
        "404":
          description: Key not found or not visible to caller
